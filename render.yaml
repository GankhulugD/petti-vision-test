# Web + model in one Docker image (see Dockerfile). Needs ~8 GB RAM.
services:
  - type: web
    name: petti-vision
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: pro
    healthCheckPath: /
    envVars:
      - key: PETTI_DEVICE
        value: cpu
      - key: PETTI_HALF
        value: "0"
